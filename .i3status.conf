general {
        colors = true
        interval = 5
}

order += "ipv6"
order += "cpu_temperature 0"
order += "disk /"
order += "wireless _first_"
order += "ethernet _first_"
order += "battery all"
order += "load"
order += "tztime local"

cpu_temperature 0 {
        format = "Tea: %degrees °C"
}

wireless _first_ {
        # format_up = "W: (%quality at %essid) %ip"
        format_up = "electromagnetic radiation: (%quality) - Leaked IP: %ip"
        format_down = "W: down"
}

ethernet _first_ {
        # if you use %speed, i3status requires root privileges
        # format_up = "E: %ip (%speed)"
        format_up = "E: Leaked IP: %ip (%speed)"
        format_down = "E: down"
}

battery all {
        format = "combustivel: %percentage %status %remaining"
}

tztime local {
        format = "%d-%m-%Y %H:%M:%S"
}

load {
        format = "System Strain: ( 1m %1min - 5m %5min - 15m %15min )"
}

disk "/" {
        format = "Fairy Dust: %avail"
}

ipv6 {
        format_up = "Useless Protocol: %ipv6"
        format_down = "Useless Protocol: Down"
}
